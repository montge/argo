<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Argo Logo v5.0 - Honoring original grayscale heritage -->
  <!-- Design: Stylized 'A' with statistical curve integrated -->

  <defs>
    <style>
      .logo-dark { fill: #100e0d; }
      .logo-curve { fill: none; stroke: #100e0d; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="64" cy="64" r="60" fill="#f0f0f0" opacity="0.3"/>

  <!-- Main 'A' letter shape -->
  <path class="logo-dark" d="
    M 40 90
    L 64 30
    L 88 90
    L 78 90
    L 64 58
    L 50 90
    Z
  "/>

  <!-- Horizontal bar of 'A' with integrated distribution curve -->
  <path class="logo-dark" d="
    M 52 70
    L 76 70
    L 76 75
    L 52 75
    Z
  "/>

  <!-- Statistical bell curve integrated into design -->
  <path class="logo-curve" d="
    M 35 100
    Q 45 85, 55 82
    Q 64 80, 73 82
    Q 83 85, 93 100
  " stroke-width="2.5"/>

  <!-- Three dots representing Monte Carlo sampling -->
  <circle class="logo-dark" cx="48" cy="102" r="2"/>
  <circle class="logo-dark" cx="64" cy="100" r="2"/>
  <circle class="logo-dark" cx="80" cy="102" r="2"/>

  <!-- Text: ARGO (below the symbol) -->
  <text x="64" y="118"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#100e0d"
        text-anchor="middle">ARGO</text>
</svg>
