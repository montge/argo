<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- About Icon - Info 'i' in circle -->

  <defs>
    <style>
      .icon-teal { fill: #01807e; }
      .icon-stroke-teal { fill: none; stroke: #01807e; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Outer circle in TEAL -->
  <circle class="icon-stroke-teal" cx="40" cy="40" r="28"/>

  <!-- Dot of 'i' in TEAL -->
  <circle class="icon-teal" cx="40" cy="26" r="3"/>

  <!-- Stem of 'i' in TEAL -->
  <rect class="icon-teal" x="37" y="34" width="6" height="22" rx="1"/>

  <!-- Base line in TEAL -->
  <rect class="icon-teal" x="32" y="56" width="16" height="3" rx="1.5"/>
</svg>
