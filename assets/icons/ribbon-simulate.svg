<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Run Simulation Icon - Play button with distribution curve (COLORFUL) -->

  <defs>
    <style>
      .icon-teal { fill: #01807e; }
      .icon-navy { fill: #263846; }
      .icon-stroke-teal { fill: none; stroke: #01807e; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Play button (triangle) in TEAL -->
  <path class="icon-teal" d="
    M 30 20
    L 30 60
    L 60 40
    Z
  "/>

  <!-- Distribution curve overlay in TEAL -->
  <path class="icon-stroke-teal" d="
    M 15 65
    Q 25 55, 35 52
    Q 40 50, 45 52
    Q 55 55, 65 65
  "/>

  <!-- Small data points in NAVY BLUE -->
  <circle class="icon-navy" cx="28" cy="58" r="1.5"/>
  <circle class="icon-navy" cx="40" cy="54" r="1.5"/>
  <circle class="icon-navy" cx="52" cy="58" r="1.5"/>
</svg>
