name: Coverage Report

on:
  push:
    branches: [ main, master, office365-linux-rebuild ]
  pull_request:
    branches: [ main, master, office365-linux-rebuild ]

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for better coverage diffs

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build argo-core
      run: npm run build --workspace=@argo/core

    - name: Build argo-cli
      run: npm run build --workspace=@argo/cli

    - name: Generate coverage
      run: |
        npm run test:coverage --workspaces

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/argo-core/coverage/lcov.info
        flags: argo-core
        name: argo-core-coverage
        fail_ci_if_error: true
        verbose: true

    # Note: JaCoCo badge generator disabled - we use Jest (JavaScript), not JaCoCo (Java)
    # Consider adding Istanbul/Jest badge generator in the future if needed

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: romeovs/lcov-reporter-action@v0.3.1
      with:
        lcov-file: ./packages/argo-core/coverage/lcov.info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        delete-old-comments: true

    - name: Check coverage thresholds
      run: |
        echo "Checking if coverage meets minimum thresholds..."
        npm run test:coverage --workspaces

        # Coverage thresholds are defined in each package's jest.config.js
        # argo-core: 80% (library code)
        # argo-cli: 40% (CLI interaction code with console output)
        echo "✅ Coverage thresholds validated by Jest configuration"

    - name: Coverage Summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Test coverage report generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Packages" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ argo-core" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See [Codecov](https://codecov.io) for detailed coverage reports" >> $GITHUB_STEP_SUMMARY
