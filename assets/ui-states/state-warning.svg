<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <style>
    .warning-triangle { fill: none; stroke: #ff8c00; stroke-width: 2; stroke-linejoin: round; }
    .warning-mark { stroke: #ff8c00; stroke-width: 2; stroke-linecap: round; }
  </style>
  <!-- Warning triangle - ORANGE warning color -->
  <path class="warning-triangle" d="M 12 3 L 21 19 L 3 19 Z"/>
