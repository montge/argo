<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Settings Icon - Gear/cog -->

  <defs>
    <style>
      .icon-teal { fill: #01807e; }
      .icon-navy { fill: #263846; }
      .icon-stroke-teal { fill: none; stroke: #01807e; stroke-width: 2.5; }
      .icon-stroke-navy { fill: none; stroke: #263846; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Gear teeth (outer) in TEAL -->
  <path class="icon-teal" d="
    M 40 15
    L 43 15 L 45 20 L 50 18 L 53 21 L 51 26
    L 56 28 L 56 32 L 51 34 L 53 39 L 50 42
    L 45 40 L 43 45 L 40 45 L 38 45 L 36 40
    L 31 42 L 28 39 L 30 34 L 25 32 L 25 28
    L 30 26 L 28 21 L 31 18 L 36 20 L 38 15
    Z
  "/>

  <!-- Center circle (hollow) in NAVY -->
  <circle cx="40" cy="30" r="8" fill="#ffffff"/>
  <circle class="icon-stroke-navy" cx="40" cy="30" r="8"/>

  <!-- Bottom slider controls in NAVY -->
  <line class="icon-stroke-navy" x1="20" y1="55" x2="60" y2="55" stroke-linecap="round"/>
  <circle class="icon-navy" cx="35" cy="55" r="4"/>

  <line class="icon-stroke-navy" x1="20" y1="65" x2="60" y2="65" stroke-linecap="round"/>
  <circle class="icon-navy" cx="50" cy="65" r="4"/>
</svg>
