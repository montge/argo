name: CI - Build and Test

on:
  push:
    branches: [ main, master, office365-linux-rebuild, develop ]
  pull_request:
    branches: [ main, master, office365-linux-rebuild, develop ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint
      continue-on-error: true

    - name: Build packages
      run: npm run build --workspaces

    - name: Run tests
      run: npm test --workspaces

    - name: Run tests with coverage
      run: npm run test:coverage --workspaces

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/argo-core/coverage/lcov.info
        flags: unittests
        name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}
        fail_ci_if_error: false
        verbose: true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
        path: |
          packages/*/coverage/
          packages/*/test-results/
        retention-days: 30

    - name: Check test coverage threshold
      run: |
        echo "Checking coverage thresholds..."
        cd packages/argo-core
        npm run test:coverage -- --passWithNoTests

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Prettier check
      run: npm run format -- --check
      continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for vulnerabilities in dependencies
      run: npm audit --production --audit-level=high

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        path: test-artifacts
        pattern: test-results-*
        merge-multiple: true

    - name: Generate test summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts for detailed coverage reports" >> $GITHUB_STEP_SUMMARY
