<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Help Icon - Question mark in circle -->

  <defs>
    <style>
      .icon-teal { fill: #01807e; }
      .icon-stroke-teal { fill: none; stroke: #01807e; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Outer circle in TEAL -->
  <circle class="icon-stroke-teal" cx="40" cy="40" r="28"/>

  <!-- Question mark in TEAL -->
  <path d="
    M 32 28
    Q 32 22, 40 22
    Q 48 22, 48 28
    Q 48 32, 44 35
    Q 40 38, 40 42
    L 40 46
  " fill="none" stroke="#01807e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dot of question mark in TEAL -->
  <circle class="icon-teal" cx="40" cy="54" r="3"/>
</svg>
